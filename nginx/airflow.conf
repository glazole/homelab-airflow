# Add to outline_wiki/nginx/conf.d (the existing homelab-nginx container).
server {
    listen 80;
    server_name airflow.handyman.moscow;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name airflow.handyman.moscow;

    ssl_certificate     /etc/nginx/certs/handyman.moscow.pem;
    ssl_certificate_key /etc/nginx/certs/handyman.moscow-key.pem;

    client_max_body_size 32M;

    location / {
        # Variable-based proxy_pass avoids startup failure if API is not yet up.
        set $airflow_upstream http://airflow-api-server:8080;
        proxy_pass $airflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
